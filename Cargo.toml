[package]
name = "git-daily-rust"
version = "0.6.5"
edition = "2024"

[[bin]]
name = "git-daily-v2"
path = "src/main.rs"

[features]
default = []
# Expose MockPrompter in release builds (debug builds have it automatically)
test-utils = []

[dependencies]
anyhow = "1"
rayon = "1"
colored = "3.0.0"
indicatif = "0.18.3"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12.0"

[dev-dependencies]
tempfile = "3"
